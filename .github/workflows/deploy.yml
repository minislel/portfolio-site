name: Deploy Vue App to TrueNAS (Local Runner)

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue App
        run: npm run build

      - name: Copy files to Nginx directory
        run: |
          cp -r dist/* /app/dist/ 